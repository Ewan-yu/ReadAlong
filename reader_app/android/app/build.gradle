plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.ewanyu.reader_app"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.ewanyu.reader_app"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 33
        targetSdk = 35
        // BlueStacks may uninstall/reinstall an APK when its versionCode is
        // unchanged, which would erase imported books and secure API keys.
        // A project-epoch timestamp makes every newly packaged APK a monotonic
        // in-place upgrade while the pubspec build number remains a floor.
        def packagedVersionCode = (Math.floorDiv(System.currentTimeMillis(), 1000L) - 1704067200L).toInteger()
        versionCode = Math.max(flutter.versionCode, packagedVersionCode)
        versionName = flutter.versionName
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
                storeFile = rootProject.file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
            }
        }
    }

    buildTypes {
        release {
            // Debug builds must not require a production signing secret.
            // A release task below still fails explicitly when the secret is
            // absent, rather than silently producing an unsigned/debug-signed
            // artifact.
            if (keystorePropertiesFile.exists()) {
                signingConfig = signingConfigs.release
            }
        }
    }
}

// `signingConfigs` is evaluated for every Gradle invocation, including
// `assembleDebug`. Defer this guard until Gradle knows the actual task graph.
// This keeps local debug APKs buildable without weakening release signing.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { task ->
        def name = task.name.toLowerCase(Locale.ROOT)
        return name.contains("release") &&
                (name.startsWith("assemble") || name.startsWith("bundle") ||
                        name.startsWith("package") || name.startsWith("sign"))
    }
    if (buildsRelease && !keystorePropertiesFile.exists()) {
        throw new GradleException("Missing android/key.properties for release signing.")
    }
}

flutter {
    source = "../.."
}
